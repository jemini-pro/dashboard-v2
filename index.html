<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="bg-blobs" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="workbench">
        <header class="toolbar card">
            <div class="toolbar-id">
                <span id="date" class="toolbar-date"></span>
                <time id="clock" class="clock" datetime="">00:00</time>
            </div>

            <label class="search-field" for="search">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-3.5-3.5"></path>
                </svg>
                <input type="search" id="search" name="search" placeholder="Search all tools…"
                    aria-label="Search all tools" autocomplete="off" spellcheck="false">
                <kbd aria-hidden="true">/</kbd>
            </label>

            <div id="health" class="health" role="status" aria-live="polite">
                <span id="health-dot" class="health-dot unknown" aria-hidden="true"></span>
                <span id="health-text">Checking…</span>
            </div>
        </header>

        <div class="body-grid">
            <main class="main-column">
                <div class="top-row">
                    <section class="card usage-card" aria-labelledby="jump-back-in-title">
                        <div class="card-head">
                            <div class="card-title">
                                <h2 id="jump-back-in-title" class="card-heading">Jump back in</h2>
                                <span class="card-sub">Most used</span>
                            </div>
                        </div>
                        <!-- Most used rows come only from the scored /api/bookmarks payload. -->
                        <ul id="most-used" class="usage-list" aria-label="Most used tools"></ul>
                    </section>

                    <section class="card launchpad-card" aria-labelledby="launchpad-title">
                        <div class="card-head">
                            <h2 id="launchpad-title" class="card-heading">Launchpad</h2>
                        </div>
                        <!-- #43 fills this region with the pinned tool tiles. -->
                        <div id="launchpad-grid" class="launchpad-grid"></div>
                    </section>
                </div>

                <section class="card all-tools-card" aria-labelledby="all-tools-title">
                    <div class="card-head">
                        <h2 id="all-tools-title" class="card-heading">All tools</h2>
                        <span id="result-count" class="card-sub"></span>
                    </div>
                    <!-- Numbered category rows injected here. -->
                    <div id="bookmarks-grid" class="bookmarks-grid"></div>
                </section>
            </main>

            <aside class="rail">
                <section class="network-panel card" aria-labelledby="network-title">
                    <div class="network-header card-head">
                        <div class="card-title">
                            <h2 id="network-title" class="card-heading">Network</h2>
                            <span id="network-summary" class="network-summary">Checking…</span>
                        </div>
                        <div class="network-status">
                            <span id="network-stale" class="network-stale" hidden>stale</span>
                            <span id="network-updated" class="network-updated"></span>
                        </div>
                    </div>
                    <!-- #45 fills this with per-kind averages, then compact device rows. -->
                    <div id="kind-chips" class="kind-chips"></div>
                    <div id="device-grid" class="device-grid">
                        <div class="device-empty">Loading devices…</div>
                    </div>
                </section>
            </aside>
        </div>
    </div>

    <div class="debug-wrapper">
        <button id="debug-menu-btn" class="debug-menu-btn" aria-label="Debug Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="5" r="1"></circle>
                <circle cx="12" cy="12" r="1"></circle>
                <circle cx="12" cy="19" r="1"></circle>
            </svg>
        </button>
        <div id="debug-controls" class="debug-controls">
            <label for="debug-time">Debug Time:</label>
            <input type="time" id="debug-time">
            <button id="reset-time">Reset</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
