<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg-blobs" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="dashboard-layout">
        <main class="main-content">
            <div class="app-container">
                <header>
                    <h1 id="greeting">Good Morning</h1>
                    <div id="clock" class="clock">00:00</div>
                </header>

                <section class="network-panel">
                    <div class="network-header">
                        <h2 class="category-title">Network</h2>
                        <span id="network-updated" class="network-updated"></span>
                    </div>
                    <div id="device-grid" class="device-grid">
                        <div class="device-empty">Loading devices…</div>
                    </div>
                </section>

                <div id="bookmarks-grid" class="bookmarks-grid">
                    <!-- Bookmarks injected here -->
                </div>
            </div>
        </main>
    </div>

    <div class="debug-wrapper">
        <button id="debug-menu-btn" class="debug-menu-btn" aria-label="Debug Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="5" r="1"></circle>
                <circle cx="12" cy="12" r="1"></circle>
                <circle cx="12" cy="19" r="1"></circle>
            </svg>
        </button>
        <div id="debug-controls" class="debug-controls">
            <label for="debug-time">Debug Time:</label>
            <input type="time" id="debug-time">
            <button id="reset-time">Reset</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
